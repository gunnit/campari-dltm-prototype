<style>
  html, body { margin: 0; padding: 0; background: #2a1f15; font-family: 'Inter', sans-serif; min-height: 100vh; }
  * { box-sizing: border-box; }
  kbd { font-family: inherit; }
  input::placeholder { color: inherit; opacity: 0.5; }

  /* Cross-fade between screens */
  .screen-wrap {
    position: absolute; inset: 0;
    opacity: 0;
    transform: scale(0.998);
    transition: opacity 260ms ease, transform 320ms cubic-bezier(.2,.7,.3,1);
    pointer-events: none;
  }
  .screen-wrap.active { opacity: 1; transform: scale(1); pointer-events: auto; }

  /* Click ripple for affordance */
  @keyframes ripple {
    from { box-shadow: 0 0 0 0 rgba(193,39,45,0.4); }
    to { box-shadow: 0 0 0 12px rgba(193,39,45,0); }
  }
</style>

<body>

<div id="root"></div>
<script src="3fbc39d8-a7e3-4019-a0dd-51e07910a62b" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="1994ba01-9c05-474b-9394-f2f7cc04afc8" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="df838078-095d-4dad-8515-4b5f49ca92fa" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="1c5d01d7-d6a8-4d19-8e0e-ad3c328ec496"></script>
<script type="text/babel" src="0183ed60-c5ce-4543-93b2-ef6ac5bd0f4b"></script>
<script type="text/babel" src="4564d468-7ddf-4b4e-b03f-f0b1d8343b14"></script>
<script type="text/babel" src="fb931047-a53b-409d-bc36-f08e849ae530"></script>
<script type="text/babel">
  const W = 1366, H = 1024;

  // Flow order per Listen/Davide (3 giu 2026): Playground (drag-and-drop
  // editing) now precedes Confronto, matching the real working sequence.
  const SCREENS = [
    { id: 'dashboard',     label: 'Dashboard',      Comp: window.WarmDashboard },
    { id: 'playground',    label: 'Playground',     Comp: window.WarmPlayground },
    { id: 'before-after',  label: 'Confronto',      Comp: window.WarmBeforeAfter },
    { id: 'final',         label: 'Anteprima',      Comp: window.WarmFinalMenu },
  ];

  function Pad({ children }) {
    return (
      <div style={{ width: W, height: H, background: '#1a1a1a', padding: 18, borderRadius: 36, position: 'relative' }}>
        <div style={{ position: 'absolute', top: '50%', left: 6, transform: 'translateY(-50%)', width: 4, height: 70, background: '#0a0a0a', borderRadius: 2 }} />
        <div style={{ position: 'absolute', top: '50%', right: 6, transform: 'translateY(-50%)', width: 4, height: 100, background: '#0a0a0a', borderRadius: 2 }} />
        <div style={{ width: '100%', height: '100%', borderRadius: 22, overflow: 'hidden', background: '#fff', position: 'relative' }}>
          {children}
        </div>
      </div>
    );
  }

  // Published confirmation overlay
  function PublishedToast({ onClose, onHome }) {
    return (
      <div style={{ position: 'absolute', inset: 0, background: 'rgba(58,31,16,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 10, fontFamily: '"DM Sans", "Inter", sans-serif' }}>
        <div style={{ background: '#fff8eb', borderRadius: 24, padding: '40px 48px 32px', textAlign: 'center', maxWidth: 460, boxShadow: '0 20px 60px rgba(0,0,0,0.4)', transform: 'rotate(-0.5deg)' }}>
          <div style={{ width: 72, height: 72, borderRadius: '50%', background: '#c1272d', color: '#f4ead8', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 18px', fontSize: 36 }}>✓</div>
          <div style={{ fontFamily: '"Playfair Display", serif', fontSize: 32, fontWeight: 500, fontStyle: 'italic', letterSpacing: -0.5, color: '#3a1f10', lineHeight: 1.1 }}>Menu pubblicato.</div>
          <div style={{ fontFamily: '"Caveat", cursive', fontSize: 22, color: '#c1272d', marginTop: 8 }}>— il QR è già live —</div>
          <div style={{ fontSize: 13, color: '#8a4a1a', marginTop: 14, lineHeight: 1.5 }}>
            Email inviata a <strong>basso@bar-basso.it</strong><br/>
            con QR, PDF stampabile e link di anteprima.
          </div>
          <div style={{ display: 'flex', gap: 10, justifyContent: 'center', marginTop: 24 }}>
            <button onClick={onClose} style={{ padding: '10px 18px', background: 'transparent', border: '1.5px solid rgba(58,31,16,0.25)', borderRadius: 22, color: '#3a1f10', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}>Resta qui</button>
            <button onClick={onHome} style={{ padding: '10px 22px', background: '#c1272d', border: 'none', borderRadius: 22, color: '#f4ead8', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit', fontWeight: 600 }}>Torna alla dashboard</button>
          </div>
        </div>
      </div>
    );
  }

  function App() {
    const [screen, setScreen] = React.useState('dashboard');
    const [published, setPublished] = React.useState(false);

    const handleNav = (target) => {
      if (target === 'published') {
        setPublished(true);
        return;
      }
      setScreen(target);
    };

    // Viewport scaling so the iPad fits any window
    const [scale, setScale] = React.useState(1);
    React.useEffect(() => {
      const PAD_W = W + 36, PAD_H = H + 36;
      const fit = () => {
        const margin = 80;
        const s = Math.min((window.innerWidth - margin) / PAD_W, (window.innerHeight - margin - 60) / PAD_H, 1);
        setScale(Math.max(0.3, s));
      };
      fit();
      window.addEventListener('resize', fit);
      return () => window.removeEventListener('resize', fit);
    }, []);

    return (
      <div style={{ width: '100vw', minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-start', padding: '24px 16px 80px', position: 'relative', background: 'radial-gradient(circle at 30% 20%, #3a2517 0%, #1f1610 70%)' }}>

        {/* Heading */}
        <div style={{ textAlign: 'center', marginBottom: 18, color: '#f4ead8', fontFamily: '"Playfair Display", serif' }}>
          <div style={{ fontSize: 11, letterSpacing: 3, textTransform: 'uppercase', opacity: 0.6 }}>Campari DLTM · Warm Italian</div>
          <div style={{ fontSize: 22, fontStyle: 'italic', fontWeight: 500, letterSpacing: -0.3, marginTop: 4 }}>Prototipo interattivo</div>
        </div>

        {/* Device */}
        <div style={{ width: (W + 36) * scale, height: (H + 36) * scale, position: 'relative' }}>
          <div style={{ width: W + 36, height: H + 36, transform: `scale(${scale})`, transformOrigin: 'top left', position: 'absolute', top: 0, left: 0 }}>
            <Pad>
              {SCREENS.map(({ id, Comp }) => (
                <div key={id} className={`screen-wrap ${screen === id ? 'active' : ''}`}>
                  <Comp onNav={handleNav} />
                </div>
              ))}
              {published && (
                <PublishedToast
                  onClose={() => setPublished(false)}
                  onHome={() => { setPublished(false); setScreen('dashboard'); }}
                />
              )}
            </Pad>
          </div>
        </div>

        {/* Bottom screen-picker */}
        <div style={{ marginTop: 22, display: 'flex', alignItems: 'center', gap: 6, padding: '8px 10px', background: 'rgba(244,234,216,0.08)', borderRadius: 28, border: '1px solid rgba(244,234,216,0.12)', backdropFilter: 'blur(8px)' }}>
          {SCREENS.map((s, i) => {
            const active = s.id === screen;
            return (
              <React.Fragment key={s.id}>
                <button
                  onClick={() => setScreen(s.id)}
                  style={{
                    padding: '8px 16px', borderRadius: 22,
                    background: active ? '#c1272d' : 'transparent',
                    color: active ? '#f4ead8' : 'rgba(244,234,216,0.7)',
                    border: 'none', cursor: 'pointer',
                    fontFamily: '"Inter", sans-serif', fontSize: 12, fontWeight: active ? 600 : 500,
                    display: 'flex', alignItems: 'center', gap: 8,
                    transition: 'background .15s, color .15s',
                  }}
                  onMouseEnter={(e) => { if (!active) e.currentTarget.style.color = '#f4ead8'; }}
                  onMouseLeave={(e) => { if (!active) e.currentTarget.style.color = 'rgba(244,234,216,0.7)'; }}
                >
                  <span style={{ fontFamily: '"Playfair Display", serif', fontSize: 12, fontStyle: 'italic', fontWeight: 600, opacity: active ? 1 : 0.6 }}>{String.fromCharCode(65 + i)}</span>
                  <span>{s.label}</span>
                </button>
                {i < SCREENS.length - 1 && (
                  <span style={{ color: 'rgba(244,234,216,0.25)', fontSize: 11 }}>→</span>
                )}
              </React.Fragment>
            );
          })}
        </div>

        <div style={{ marginTop: 14, fontFamily: '"Caveat", cursive', color: 'rgba(244,234,216,0.5)', fontSize: 16 }}>
          clicca i bottoni dentro lo schermo per navigare — oppure usa le tab qui sopra
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


</body></html>
